<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ロンドン エリア探訪マップ — チーム共有版（Supabase）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F1ECE0;
    --paper-raised: #FBF8F1;
    --ink: #26332C;
    --ink-soft: #5B6A61;
    --sage: #7C9678;
    --sage-dim: #C7D3BE;
    --brick: #A6432F;
    --brick-dim: #E2C3B6;
    --river: #9FC1D9;
    --tan-line: #CBBB98;
    --shadow: rgba(38, 51, 44, 0.16);
    --panel-w: 380px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1B211C;
      --paper-raised: #232B24;
      --ink: #E9E6DA;
      --ink-soft: #A7B2A8;
      --sage: #92AC8C;
      --sage-dim: #3A4A3B;
      --brick: #D97A63;
      --brick-dim: #4A332C;
      --river: #3E5A6C;
      --tan-line: #4B4433;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B211C;
    --paper-raised: #232B24;
    --ink: #E9E6DA;
    --ink-soft: #A7B2A8;
    --sage: #92AC8C;
    --sage-dim: #3A4A3B;
    --brick: #D97A63;
    --brick-dim: #4A332C;
    --river: #3E5A6C;
    --tan-line: #4B4433;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif;
    height: 100%;
    overflow-x: hidden;
  }
  #app { display: flex; min-height: 100vh; position: relative; }

  header.topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 18px 22px;
    background: linear-gradient(to bottom, var(--paper) 65%, transparent);
    pointer-events: none;
  }
  header.topbar h1 {
    font-family: Georgia, 'Hiragino Mincho ProN', serif;
    font-weight: 600;
    font-size: 21px;
    margin: 0;
  }
  header.topbar p { margin: 0; font-size: 13px; color: var(--ink-soft); }

  main.map-wrap { flex: 1; position: relative; min-width: 0; }
  svg#londonmap { width: 100%; height: 100vh; display: block; }

  .thames { fill: none; stroke: var(--river); stroke-width: 16; stroke-linecap: round; opacity: 0.55; }
  .line-path { fill: none; stroke-width: 3.2; stroke-linecap: round; opacity: 0.9; }
  .line-path.dash { stroke-dasharray: 2 7; stroke-width: 2.6; opacity: 0.85; }

  .airport-icon circle { fill: var(--ink); stroke: var(--paper-raised); stroke-width: 2; }
  .airport-icon text.glyph { fill: var(--paper); font-size: 10px; text-anchor: middle; dominant-baseline: central; }
  .airport-label { font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: var(--ink-soft); pointer-events: none; }

  .town-dot { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 1.6; }
  .town-label { font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif; font-size: 12.5px; font-weight: 600; fill: var(--ink); pointer-events: none; }
  .town-sub { font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif; font-size: 10px; fill: var(--ink-soft); pointer-events: none; }

  .star-btn { cursor: pointer; }
  .star-btn .star-shape {
    fill: var(--brick-dim); stroke: var(--brick); stroke-width: 1.3;
    transition: transform 0.18s ease, fill 0.18s ease;
    transform-origin: center; transform-box: fill-box;
  }
  .star-btn:hover .star-shape, .star-btn.active .star-shape { fill: var(--brick); transform: scale(1.28); }
  .star-btn.saved .star-shape { fill: var(--brick); }

  aside#panel {
    width: var(--panel-w); flex-shrink: 0;
    background: var(--paper-raised);
    border-left: 1px solid var(--tan-line);
    box-shadow: -8px 0 24px var(--shadow);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(.4,0,.2,1);
    position: relative; z-index: 30;
  }
  aside#panel.open { transform: translateX(0); }
  .panel-inner { padding: 26px 24px 24px; overflow-y: auto; flex: 1; }
  .panel-empty { padding: 40px 26px; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
  .panel-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; color: var(--ink-soft);
    font-size: 20px; cursor: pointer; line-height: 1; padding: 6px;
  }
  .panel-eyebrow { font-size: 12px; color: var(--brick); margin: 0 0 4px; }
  .panel-title { font-family: Georgia, 'Hiragino Mincho ProN', serif; font-weight: 600; font-size: 24px; margin: 0 0 14px; padding-right: 30px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
  .tag { font-size: 12px; padding: 5px 10px; border: 1px solid var(--sage); color: var(--ink); border-radius: 3px; }
  .panel-blurb { font-size: 14.5px; line-height: 1.75; color: var(--ink); margin-bottom: 20px; }
  .section-label { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; border-bottom: 1px solid var(--tan-line); padding-bottom: 6px; }
  .transit-row { display: flex; align-items: center; gap: 9px; font-size: 13.5px; margin-bottom: 7px; }
  .line-swatch { width: 20px; height: 4px; border-radius: 2px; flex-shrink: 0; }
  .price-line { font-size: 13.5px; display: flex; justify-content: space-between; margin-bottom: 4px; }
  .price-line strong { font-family: Georgia, 'Hiragino Mincho ProN', serif; font-weight: 600; font-size: 15px; }
  .divider { height: 1px; background: var(--tan-line); margin: 20px 0; }

  textarea#notesBox {
    width: 100%; min-height: 90px; resize: vertical;
    border: 1px solid var(--tan-line); background: var(--paper); color: var(--ink);
    font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif; font-size: 13.5px; padding: 10px; border-radius: 3px; line-height: 1.6;
  }
  textarea#notesBox:focus { outline: 2px solid var(--brick); outline-offset: 1px; }
  input#folderLink {
    width: 100%; border: 1px solid var(--tan-line); background: var(--paper); color: var(--ink);
    font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif; font-size: 13px; padding: 9px 10px; border-radius: 3px; margin-bottom: 8px;
  }
  input#folderLink:focus { outline: 2px solid var(--brick); outline-offset: 1px; }
  .btn-row { display: flex; gap: 8px; }
  button.btn {
    font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif; font-size: 13px; font-weight: 600;
    padding: 9px 14px; border-radius: 3px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); cursor: pointer;
  }
  button.btn.secondary { background: transparent; color: var(--ink); }
  .save-hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; }

  .legend {
    position: absolute; right: 22px; bottom: 20px; z-index: 15;
    font-size: 11.5px; color: var(--ink-soft);
    background: var(--paper); padding: 12px 14px;
    border: 1px solid var(--tan-line); border-radius: 4px;
    max-width: 250px; line-height: 1.5;
  }
  .legend-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 8px; cursor: grab; touch-action: none;
    user-select: none;
  }
  .legend-header:active { cursor: grabbing; }
  .legend-header strong { color: var(--ink); font-size: 12px; }
  .legend-header .drag-hint { font-weight: 400; color: var(--ink-soft); font-size: 10px; }
  .legend-toggle {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid var(--tan-line); background: transparent;
    color: var(--ink-soft); font-size: 14px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .legend.collapsed #legendBody { display: none; }
  .legend strong { color: var(--ink); font-size: 12px; }
  .legend-row { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
  .legend-swatch { width: 16px; height: 3px; border-radius: 2px; flex-shrink: 0; }
  .legend-note { margin-top: 8px; font-size: 10.5px; opacity: 0.85; }

  @media (max-width: 760px) {
    :root { --panel-w: 100%; }
    header.topbar h1 { font-size: 18px; }
    header.topbar p { display: none; }
    aside#panel {
      position: fixed; left: 0; right: 0; bottom: 0; top: 24%;
      border-left: none; border-top: 1px solid var(--tan-line);
      border-radius: 14px 14px 0 0; transform: translateY(100%);
    }
    aside#panel.open { transform: translateY(0); }
    .legend { max-width: 160px; font-size: 10px; padding: 8px 10px; }
    .legend strong { font-size: 11px; }
    .legend-header .drag-hint { display: none; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <h1>ロンドン エリア探訪マップ</h1>
    <p>チーム共有版（Supabase） — 同じ合言葉を使う人同士でメモがリアルタイムに共有されます</p>
  </header>

  <main class="map-wrap">
    <svg id="londonmap" viewBox="0 0 760 620" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" id="legendBox">
      <div class="legend-header" id="legendHandle">
        <strong>路線凡例 <span class="drag-hint">(ドラッグで移動)</span></strong>
        <button class="legend-toggle" id="legendToggle" type="button" aria-label="折りたたむ / 展開する">−</button>
      </div>
      <div id="legendBody"></div>
    </div>
  </main>

  <aside id="panel">
    <button class="panel-close" id="closePanel" aria-label="閉じる">✕</button>
    <div class="panel-inner" id="panelInner">
      <div class="panel-empty">地図の ★ マークをクリックすると、そのエリアの特徴・鉄道路線・メモ欄がここに表示されます。</div>
    </div>
  </aside>
</div>

  { id: "kings_cross", name: "King's Cross", sub: "キングスクロス", x: 360, y: 165,

  { id: "islington", name: "Islington", sub: "イズリントン", x: 450, y: 110,

  { id: "stratford", name: "Stratford", sub: "ストラトフォード", x: 620, y: 140,

  { id: "notting_hill", name: "Notting Hill", sub: "ノッティングヒル", x: 170, y: 290,

  { id: "shepherds_bush", name: "Shepherd's Bush", sub: "シェパーズ・ブッシュ / ホーランドパーク周辺", x: 90, y: 225,

const svgNS = "http://www.w3.org/2000/svg";

function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);

}

// Thames — stylised, not geographically precise
const thames = el("path", {

svg.appendChild(thames);

const townMap = Object.fromEntries(towns.map(t => [t.id, t]));

[...edges, ...airportEdges].forEach(([a, b, lineKey]) => {

  const path = el("path", {
    d: `M ${na.x} ${na.y} L ${nb.x} ${nb.y}`,
    class: "line-path" + (info.dashed ? " dash" : ""),
    stroke: info.color
  });
  svg.appendChild(path);
});

function starPath(cx, cy, r) {
  const points = [];
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI / 5) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.42;
    points.push(`${cx + rad * Math.cos(angle)},${cy + rad * Math.sin(angle)}`);
  }
  return "M " + points.join(" L ") + " Z";
}

towns.forEach(t => {

airports.forEach(a => {

// build legend from lines actually used
const usedLines = [...new Set([...edges, ...airportEdges].map(e => e[2]))];
const legendBox = document.getElementById("legendBox");
const legendBody = document.getElementById("legendBody");
legendBody.innerHTML =
  usedLines.map(key => `
    <div class="legend-row">
      <span class="legend-swatch" style="background:${lineColors[key].color}"></span>
      <span>${lineColors[key].label}</span>
    </div>
  `).join("") +
  `<div class="legend-note">✈ = 空港（簡易表示）。概念図のため実際の経路・駅間隔とは異なります</div>`;

// ---- Legend: draggable + collapsible, position/state remembered on this device only ----
const legendHandle = document.getElementById("legendHandle");
const legendToggle = document.getElementById("legendToggle");

function clamp(val, min, max) { return Math.min(max, Math.max(min, val)); }

function loadLegendState() {
  try {
    const raw = localStorage.getItem("london-explorer:legend-state");
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveLegendState(state) {
  try { localStorage.setItem("london-explorer:legend-state", JSON.stringify(state)); }
  catch (e) { /* storage unavailable, ignore */ }
}

function placeAt(left, top) {
  const rect = legendBox.getBoundingClientRect();
  const parentRect = legendBox.offsetParent.getBoundingClientRect();
  const maxLeft = parentRect.width - rect.width - 8;
  const maxTop = parentRect.height - rect.height - 8;
  left = clamp(left, 8, Math.max(8, maxLeft));
  top = clamp(top, 8, Math.max(8, maxTop));
  legendBox.style.left = left + "px";
  legendBox.style.top = top + "px";
  legendBox.style.right = "auto";
  legendBox.style.bottom = "auto";
  return { left, top };
}

const savedLegendState = loadLegendState();
if (savedLegendState && savedLegendState.collapsed) {
  legendBox.classList.add("collapsed");
}
if (savedLegendState && typeof savedLegendState.left === "number") {
  requestAnimationFrame(() => placeAt(savedLegendState.left, savedLegendState.top));
}

let dragging = false, dragOffsetX = 0, dragOffsetY = 0;

legendHandle.addEventListener("pointerdown", (e) => {
  if (e.target === legendToggle) return;
  dragging = true;
  legendHandle.setPointerCapture(e.pointerId);
  const rect = legendBox.getBoundingClientRect();
  const parentRect = legendBox.offsetParent.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  legendBox._parentRect = parentRect;
});
legendHandle.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const parentRect = legendBox.offsetParent.getBoundingClientRect();
  placeAt(e.clientX - parentRect.left - dragOffsetX, e.clientY - parentRect.top - dragOffsetY);
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  const cur = loadLegendState() || {};
  const rect = legendBox.getBoundingClientRect();
  const parentRect = legendBox.offsetParent.getBoundingClientRect();
  saveLegendState({
    ...cur,
    left: rect.left - parentRect.left,
    top: rect.top - parentRect.top
  });
}
legendHandle.addEventListener("pointerup", endDrag);
legendHandle.addEventListener("pointercancel", endDrag);

legendToggle.addEventListener("pointerdown", (e) => e.stopPropagation());
legendToggle.addEventListener("click", () => {
  const collapsed = legendBox.classList.toggle("collapsed");
  legendToggle.textContent = collapsed ? "+" : "−";
  const cur = loadLegendState() || {};
  saveLegendState({ ...cur, collapsed });
});
if (savedLegendState && savedLegendState.collapsed) {
  legendToggle.textContent = "+";
}

const panel = document.getElementById("panel");
const panelInner = document.getElementById("panelInner");

// ---- Supabase configuration ----
// 1) https://supabase.com でプロジェクトを作成（無料プランでOK）
// 2) SQLエディタで配布した schema.sql の内容を実行してテーブルを作成
// 3) 左メニュー「Project Settings」→「API」で Project URL と anon/public key（新しい表記では
//    "publishable key"）を確認し、下の2つの値をその内容に書き換える
const SUPABASE_URL = "https://zvlghhlioykiyljionze.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Mg7TQaYUt0SKVGee4DgdBw_adxxUBpK";

let sb = null;
try {
  if (SUPABASE_URL !== "https://YOUR_PROJECT.supabase.co" && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { sb = null; }

// ---- Shared "room": a team passphrase scopes everyone to the same notes ----
function getRoomKey() {
  try {
    let key = localStorage.getItem("london-explorer:room-key");
    if (!key) {
      key = (window.prompt(
        "チームで共有する合言葉を入力してください（初回のみ。全員が同じ合言葉を使ってください）"
      ) || "default-room").trim() || "default-room";
      localStorage.setItem("london-explorer:room-key", key);
    }
    return key;
  } catch (e) { return "default-room"; }
}
const roomKey = sb ? getRoomKey() : null;

function localKey(id) { return "london-explorer:" + id; }
function loadLocal(id) {
  try {
    const raw = localStorage.getItem(localKey(id));
    return raw ? JSON.parse(raw) : { notes: "", folderLink: "", folderLink2: "" };
  } catch (e) { return { notes: "", folderLink: "", folderLink2: "" }; }
}
function saveLocal(id, data) {
  try { localStorage.setItem(localKey(id), JSON.stringify(data)); }
  catch (e) { /* storage unavailable, ignore */ }
}
async function loadShared(id) {
  if (!sb) return null;
  try {
    const { data, error } = await sb
      .from("notes")
      .select("notes, folder_link, folder_link_2")
      .eq("room_key", roomKey)
      .eq("town_id", id)
      .maybeSingle();
    if (error) return null;
    if (!data) return { notes: "", folderLink: "", folderLink2: "" };
    return { notes: data.notes || "", folderLink: data.folder_link || "", folderLink2: data.folder_link_2 || "" };
  } catch (e) { return null; }
}
async function saveSharedField(id, field, value) {
  if (!sb) return false;
  const columnMap = { notes: "notes", folderLink: "folder_link", folderLink2: "folder_link_2" };
  const column = columnMap[field] || "notes";
  try {
    const { error } = await sb
      .from("notes")
      .upsert(
        { room_key: roomKey, town_id: id, [column]: value, updated_at: new Date().toISOString() },
        { onConflict: "room_key,town_id" }
      );
    return !error;
  } catch (e) { return false; }
}
function debounce(fn, wait) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), wait);
  };
}

let currentChannel = null;
let currentId = null;

async function openPanel(id) {
  document.querySelectorAll(".star-btn").forEach(s => s.classList.remove("active"));
  document.getElementById("star-" + id).classList.add("active");
  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  currentId = id;

  const t = townMap[id];
  const shared = !!sb;
  let saved = shared ? await loadShared(id) : null;
  if (saved === null) saved = loadLocal(id);

  panelInner.innerHTML = `
    <p class="panel-eyebrow">${t.sub}</p>
    <h2 class="panel-title">${t.name}</h2>
    <div class="tag-row">${t.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
    <p class="panel-blurb">${t.blurb}</p>

    <p class="section-label">路線</p>
    ${t.lines.map(l => `
      <div class="transit-row">
        <span class="line-swatch" style="background:${l.color}"></span>
        <span>${l.label}</span>
      </div>
    `).join("")}
    <div class="price-line" style="margin-top:12px;">
      <span>トラベルゾーン</span><strong>${t.zone}</strong>
    </div>
    <div class="price-line">
      <span>平均物件価格の目安</span><strong>${t.priceAvg}</strong>
    </div>

    <div class="divider"></div>

    <p class="section-label">物件フォルダーへのリンク 1</p>
    <input type="text" id="folderLink" placeholder="Google Drive / Dropbox などのリンクを貼る">
    <div class="btn-row">
      <button class="btn" id="openFolderBtn">開く</button>
      <button class="btn secondary" id="saveFolderBtn">保存</button>
    </div>

    <p class="section-label" style="margin-top:16px;">物件フォルダーへのリンク 2</p>
    <input type="text" id="folderLink2" placeholder="Google Drive / Dropbox などのリンクを貼る">
    <div class="btn-row">
      <button class="btn" id="openFolderBtn2">開く</button>
      <button class="btn secondary" id="saveFolderBtn2">保存</button>
    </div>

    <div class="divider"></div>

    <p class="section-label">メモ</p>
    <textarea id="notesBox" placeholder="内見の感想、気になった物件、質問リストなど"></textarea>
    <p class="save-hint">${shared
      ? "同じ合言葉を使う人全員にリアルタイムで共有されます"
      : "Supabase未設定のため、この端末のブラウザにのみ保存されます"}</p>
  `;

  const notesInput = document.getElementById("notesBox");
  const folderInput = document.getElementById("folderLink");
  const folderInput2 = document.getElementById("folderLink2");
  notesInput.value = saved.notes || "";
  folderInput.value = saved.folderLink || "";
  folderInput2.value = saved.folderLink2 || "";

  const markSaved = () => {
    document.getElementById("star-" + id).classList.toggle(
      "saved", !!notesInput.value || !!folderInput.value || !!folderInput2.value
    );
  };

  const debouncedSaveNotes = debounce(async (value) => {
    if (shared) {
      const ok = await saveSharedField(id, "notes", value);
      if (!ok) saveLocal(id, { ...loadLocal(id), notes: value });
    } else {
      saveLocal(id, { ...loadLocal(id), notes: value });
    }
    markSaved();
  }, 500);
  notesInput.addEventListener("input", (e) => debouncedSaveNotes(e.target.value));

  document.getElementById("saveFolderBtn").addEventListener("click", async () => {
    const link = folderInput.value.trim();
    if (shared) {
      const ok = await saveSharedField(id, "folderLink", link);
      if (!ok) saveLocal(id, { ...loadLocal(id), folderLink: link });
    } else {
      saveLocal(id, { ...loadLocal(id), folderLink: link });
    }
    markSaved();
  });
  document.getElementById("openFolderBtn").addEventListener("click", () => {
    const link = folderInput.value.trim();
    if (link) {
      try {
        const url = link.startsWith("http") ? link : "https://" + link;
        window.open(url, "_blank", "noopener,noreferrer");
      } catch (e) { /* invalid url, ignore */ }
    }
  });

  document.getElementById("saveFolderBtn2").addEventListener("click", async () => {
    const link = folderInput2.value.trim();
    if (shared) {
      const ok = await saveSharedField(id, "folderLink2", link);
      if (!ok) saveLocal(id, { ...loadLocal(id), folderLink2: link });
    } else {
      saveLocal(id, { ...loadLocal(id), folderLink2: link });
    }
    markSaved();
  });
  document.getElementById("openFolderBtn2").addEventListener("click", () => {
    const link = folderInput2.value.trim();
    if (link) {
      try {
        const url = link.startsWith("http") ? link : "https://" + link;
        window.open(url, "_blank", "noopener,noreferrer");
      } catch (e) { /* invalid url, ignore */ }
    }
  });

  markSaved();

  if (shared) {
    currentChannel = sb
      .channel("notes-" + id + "-" + roomKey)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "notes", filter: `town_id=eq.${id}` },
        (payload) => {
          if (currentId !== id) return;
          const row = payload.new;
          if (!row || row.room_key !== roomKey) return;
          if (document.activeElement !== notesInput && typeof row.notes === "string" && notesInput.value !== row.notes) {
            notesInput.value = row.notes;
          }
          if (document.activeElement !== folderInput && typeof row.folder_link === "string" && folderInput.value !== row.folder_link) {
            folderInput.value = row.folder_link;
          }
          if (document.activeElement !== folderInput2 && typeof row.folder_link_2 === "string" && folderInput2.value !== row.folder_link_2) {
            folderInput2.value = row.folder_link_2;
          }
          markSaved();
        }
      )
      .subscribe();
  }

  panel.classList.add("open");
}

document.getElementById("closePanel").addEventListener("click", () => {
  panel.classList.remove("open");
  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  currentId = null;
});

// mark stars that already have saved notes
(async () => {
  for (const t of towns) {
    let saved = sb ? await loadShared(t.id) : null;
    if (saved === null) saved = loadLocal(t.id);
    if (saved && (saved.notes || saved.folderLink || saved.folderLink2)) {
      const starEl = document.getElementById("star-" + t.id);
      if (starEl) starEl.classList.add("saved");
    }
  }
})();
</script>

    const angle = (Math.PI / 5) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.42;
    points.push(`${cx + rad * Math.cos(angle)},${cy + rad * Math.sin(angle)}`);
  }
  return "M " + points.join(" L ") + " Z";
}

towns.forEach(t => {
  const g = el("g", {});
  g.appendChild(el("circle", { cx: t.x, cy: t.y, r: 5, class: "town-dot" }));

airports.forEach(a => {
  const g = el("g", { class: "airport-icon" });
  g.appendChild(el("circle", { cx: a.x, cy: a.y, r: 10 }));

  });

// build legend from lines actually used
const usedLines = [...new Set([...edges, ...airportEdges].map(e => e[2]))];
const legendBox = document.getElementById("legendBox");
const legendBody = document.getElementById("legendBody");
legendBody.innerHTML =
  usedLines.map(key => `
    <div class="legend-row">
      <span class="legend-swatch" style="background:${lineColors[key].color}"></span>
      <span>${lineColors[key].label}</span>
    </div>
  `).join("") +
  `<div class="legend-note">✈ = 空港（簡易表示）。概念図のため実際の経路・駅間隔とは異なります</div>`;

// ---- Legend: draggable + collapsible, position/state remembered on this device only ----
const legendHandle = document.getElementById("legendHandle");
const legendToggle = document.getElementById("legendToggle");

function clamp(val, min, max) { return Math.min(max, Math.max(min, val)); }

function loadLegendState() {
  try {
    const raw = localStorage.getItem("london-explorer:legend-state");
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveLegendState(state) {
  try { localStorage.setItem("london-explorer:legend-state", JSON.stringify(state)); }
  catch (e) { /* storage unavailable, ignore */ }
}

function placeAt(left, top) {
  const rect = legendBox.getBoundingClientRect();
  const parentRect = legendBox.offsetParent.getBoundingClientRect();
  const maxLeft = parentRect.width - rect.width - 8;
  const maxTop = parentRect.height - rect.height - 8;
  left = clamp(left, 8, Math.max(8, maxLeft));
  top = clamp(top, 8, Math.max(8, maxTop));
  legendBox.style.left = left + "px";
  legendBox.style.top = top + "px";
  legendBox.style.right = "auto";
  legendBox.style.bottom = "auto";
  return { left, top };
}

const savedLegendState = loadLegendState();
if (savedLegendState && savedLegendState.collapsed) {
  legendBox.classList.add("collapsed");
}
if (savedLegendState && typeof savedLegendState.left === "number") {
  requestAnimationFrame(() => placeAt(savedLegendState.left, savedLegendState.top));
}

let dragging = false, dragOffsetX = 0, dragOffsetY = 0;

legendHandle.addEventListener("pointerdown", (e) => {
  if (e.target === legendToggle) return;
  dragging = true;
  legendHandle.setPointerCapture(e.pointerId);
  const rect = legendBox.getBoundingClientRect();
  const parentRect = legendBox.offsetParent.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  legendBox._parentRect = parentRect;
});
legendHandle.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const parentRect = legendBox.offsetParent.getBoundingClientRect();
  placeAt(e.clientX - parentRect.left - dragOffsetX, e.clientY - parentRect.top - dragOffsetY);
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  const cur = loadLegendState() || {};
  const rect = legendBox.getBoundingClientRect();
  const parentRect = legendBox.offsetParent.getBoundingClientRect();
  saveLegendState({
    ...cur,
    left: rect.left - parentRect.left,
    top: rect.top - parentRect.top
  });
}
legendHandle.addEventListener("pointerup", endDrag);
legendHandle.addEventListener("pointercancel", endDrag);

legendToggle.addEventListener("pointerdown", (e) => e.stopPropagation());
legendToggle.addEventListener("click", () => {
  const collapsed = legendBox.classList.toggle("collapsed");
  legendToggle.textContent = collapsed ? "+" : "−";
  const cur = loadLegendState() || {};
  saveLegendState({ ...cur, collapsed });
});
if (savedLegendState && savedLegendState.collapsed) {
  legendToggle.textContent = "+";
}

const panel = document.getElementById("panel");
const panelInner = document.getElementById("panelInner");

// ---- Supabase configuration ----
// 1) https://supabase.com でプロジェクトを作成（無料プランでOK）
// 2) SQLエディタで配布した schema.sql の内容を実行してテーブルを作成
// 3) 左メニュー「Project Settings」→「API」で Project URL と anon/public key（新しい表記では
//    "publishable key"）を確認し、下の2つの値をその内容に書き換える
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

let sb = null;
try {
  if (SUPABASE_URL !== "https://YOUR_PROJECT.supabase.co" && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { sb = null; }

// ---- Shared "room": a team passphrase scopes everyone to the same notes ----
function getRoomKey() {
  try {
    let key = localStorage.getItem("london-explorer:room-key");
    if (!key) {
      key = (window.prompt(
        "チームで共有する合言葉を入力してください（初回のみ。全員が同じ合言葉を使ってください）"
      ) || "default-room").trim() || "default-room";
      localStorage.setItem("london-explorer:room-key", key);
    }
    return key;
  } catch (e) { return "default-room"; }
}
const roomKey = sb ? getRoomKey() : null;

function localKey(id) { return "london-explorer:" + id; }
function loadLocal(id) {
  try {
    const raw = localStorage.getItem(localKey(id));
    return raw ? JSON.parse(raw) : { notes: "", folderLink: "", folderLink2: "" };
  } catch (e) { return { notes: "", folderLink: "", folderLink2: "" }; }
}
function saveLocal(id, data) {
  try { localStorage.setItem(localKey(id), JSON.stringify(data)); }
  catch (e) { /* storage unavailable, ignore */ }
}
async function loadShared(id) {
  if (!sb) return null;
  try {
    const { data, error } = await sb
      .from("notes")
      .select("notes, folder_link, folder_link_2")
      .eq("room_key", roomKey)
      .eq("town_id", id)
      .maybeSingle();
    if (error) return null;
    if (!data) return { notes: "", folderLink: "", folderLink2: "" };
    return { notes: data.notes || "", folderLink: data.folder_link || "", folderLink2: data.folder_link_2 || "" };
  } catch (e) { return null; }
}
async function saveSharedField(id, field, value) {
  if (!sb) return false;
  const columnMap = { notes: "notes", folderLink: "folder_link", folderLink2: "folder_link_2" };
  const column = columnMap[field] || "notes";
  try {
    const { error } = await sb
      .from("notes")
      .upsert(
        { room_key: roomKey, town_id: id, [column]: value, updated_at: new Date().toISOString() },
        { onConflict: "room_key,town_id" }
      );
    return !error;
  } catch (e) { return false; }
}
function debounce(fn, wait) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), wait);
  };
}

let currentChannel = null;
let currentId = null;

async function openPanel(id) {
  document.querySelectorAll(".star-btn").forEach(s => s.classList.remove("active"));
  document.getElementById("star-" + id).classList.add("active");
  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  currentId = id;

  const t = townMap[id];
  const shared = !!sb;
  let saved = shared ? await loadShared(id) : null;
  if (saved === null) saved = loadLocal(id);

  panelInner.innerHTML = `
    <p class="panel-eyebrow">${t.sub}</p>
    <h2 class="panel-title">${t.name}</h2>
    <div class="tag-row">${t.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
    <p class="panel-blurb">${t.blurb}</p>

    <p class="section-label">路線</p>
    ${t.lines.map(l => `
      <div class="transit-row">
        <span class="line-swatch" style="background:${l.color}"></span>
        <span>${l.label}</span>
      </div>
    `).join("")}
    <div class="price-line" style="margin-top:12px;">
      <span>トラベルゾーン</span><strong>${t.zone}</strong>
    </div>
    <div class="price-line">
      <span>平均物件価格の目安</span><strong>${t.priceAvg}</strong>
    </div>

    <div class="divider"></div>

    <p class="section-label">物件フォルダーへのリンク 1</p>
    <input type="text" id="folderLink" placeholder="Google Drive / Dropbox などのリンクを貼る">
    <div class="btn-row">
      <button class="btn" id="openFolderBtn">開く</button>
      <button class="btn secondary" id="saveFolderBtn">保存</button>
    </div>

    <p class="section-label" style="margin-top:16px;">物件フォルダーへのリンク 2</p>
    <input type="text" id="folderLink2" placeholder="Google Drive / Dropbox などのリンクを貼る">
    <div class="btn-row">
      <button class="btn" id="openFolderBtn2">開く</button>
      <button class="btn secondary" id="saveFolderBtn2">保存</button>
    </div>

    <div class="divider"></div>

    <p class="section-label">メモ</p>
    <textarea id="notesBox" placeholder="内見の感想、気になった物件、質問リストなど"></textarea>
    <p class="save-hint">${shared
      ? "同じ合言葉を使う人全員にリアルタイムで共有されます"
      : "Supabase未設定のため、この端末のブラウザにのみ保存されます"}</p>
  `;

  const notesInput = document.getElementById("notesBox");
  const folderInput = document.getElementById("folderLink");
  const folderInput2 = document.getElementById("folderLink2");
  notesInput.value = saved.notes || "";
  folderInput.value = saved.folderLink || "";
  folderInput2.value = saved.folderLink2 || "";

  const markSaved = () => {
    document.getElementById("star-" + id).classList.toggle(
      "saved", !!notesInput.value || !!folderInput.value || !!folderInput2.value
    );
  };

  const debouncedSaveNotes = debounce(async (value) => {
    if (shared) {
      const ok = await saveSharedField(id, "notes", value);
      if (!ok) saveLocal(id, { ...loadLocal(id), notes: value });
    } else {
      saveLocal(id, { ...loadLocal(id), notes: value });
    }
    markSaved();
  }, 500);
  notesInput.addEventListener("input", (e) => debouncedSaveNotes(e.target.value));

  document.getElementById("saveFolderBtn").addEventListener("click", async () => {
    const link = folderInput.value.trim();
    if (shared) {
      const ok = await saveSharedField(id, "folderLink", link);
      if (!ok) saveLocal(id, { ...loadLocal(id), folderLink: link });
    } else {
      saveLocal(id, { ...loadLocal(id), folderLink: link });
    }
    markSaved();
  });
  document.getElementById("openFolderBtn").addEventListener("click", () => {
    const link = folderInput.value.trim();
    if (link) {
      try {
        const url = link.startsWith("http") ? link : "https://" + link;
        window.open(url, "_blank", "noopener,noreferrer");
      } catch (e) { /* invalid url, ignore */ }
    }
  });

  document.getElementById("saveFolderBtn2").addEventListener("click", async () => {
    const link = folderInput2.value.trim();
    if (shared) {
      const ok = await saveSharedField(id, "folderLink2", link);
      if (!ok) saveLocal(id, { ...loadLocal(id), folderLink2: link });
    } else {
      saveLocal(id, { ...loadLocal(id), folderLink2: link });
    }
    markSaved();
  });
  document.getElementById("openFolderBtn2").addEventListener("click", () => {
    const link = folderInput2.value.trim();
    if (link) {
      try {
        const url = link.startsWith("http") ? link : "https://" + link;
        window.open(url, "_blank", "noopener,noreferrer");
      } catch (e) { /* invalid url, ignore */ }
    }
  });

  markSaved();

  if (shared) {
    currentChannel = sb
      .channel("notes-" + id + "-" + roomKey)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "notes", filter: `town_id=eq.${id}` },
        (payload) => {
          if (currentId !== id) return;
          const row = payload.new;
          if (!row || row.room_key !== roomKey) return;
          if (document.activeElement !== notesInput && typeof row.notes === "string" && notesInput.value !== row.notes) {
            notesInput.value = row.notes;
          }
          if (document.activeElement !== folderInput && typeof row.folder_link === "string" && folderInput.value !== row.folder_link) {
            folderInput.value = row.folder_link;
          }
          if (document.activeElement !== folderInput2 && typeof row.folder_link_2 === "string" && folderInput2.value !== row.folder_link_2) {
            folderInput2.value = row.folder_link_2;
          }
          markSaved();
        }
      )
      .subscribe();
  }

  panel.classList.add("open");
}

document.getElementById("closePanel").addEventListener("click", () => {
  panel.classList.remove("open");
  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  currentId = null;
});

// mark stars that already have saved notes
(async () => {
  for (const t of towns) {
    let saved = sb ? await loadShared(t.id) : null;
    if (saved === null) saved = loadLocal(t.id);
    if (saved && (saved.notes || saved.folderLink || saved.folderLink2)) {
      const starEl = document.getElementById("star-" + t.id);
      if (starEl) starEl.classList.add("saved");
    }
  }
})();
</script>
